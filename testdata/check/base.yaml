# PD-shaped base spec for the golden tests: each case applies one textual edit (docs/06 section 14.2).
openapi: 3.0.3
info: {title: product-detail, version: "1"}
paths:
  /v1/products/:
    post:
      operationId: getProducts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductsRequest"}
      responses:
        "200":
          description: products
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductsResponse"}
components:
  schemas:
    Item:
      type: object
      required: [id, selling_price]
      properties:
        id: {type: integer, format: int64}
        selling_price: {type: integer, format: int64}
        title: {type: string}
    ProductsResponse:
      type: array
      items: {$ref: "#/components/schemas/Item"}
    ProductsRequest:
      type: object
      properties:
        ids:
          type: array
          items: {type: integer, format: int64}
        limit: {type: integer, format: int64}
