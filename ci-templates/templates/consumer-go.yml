# argus consumer-go component: runs Go Pact consumer tests (build tag `pact`) on MRs and the
# default branch; publishes pacts to the broker from the default branch only.
spec:
  inputs:
    golang_pact_image:
      default: artifactory.digikala.com/argus/golang-pact:1.26
      description: Debian golang + libpact_ffi preinstalled (never Alpine/musl)
    argus_image:
      default: artifactory.digikala.com/argus/argus-cli:1.0.0
      description: contains the pact-broker CLI used for publishing
    stage:
      default: test
    packages:
      default: ./...
    test_command:
      default: ""
      description: overrides the default `go test -tags pact -run Pact -count=1 -p 1 <packages>`
    pact_dir:
      default: pacts
      description: PactDir your tests write to, relative to the repo root
---
.argus-credentials:
  before_script:
    - |
      if [ "$CI_COMMIT_REF_PROTECTED" = "true" ] && [ -n "$ARGUS_RW_PACT_BROKER_USERNAME" ]; then
        export PACT_BROKER_USERNAME="$ARGUS_RW_PACT_BROKER_USERNAME" PACT_BROKER_PASSWORD="$ARGUS_RW_PACT_BROKER_PASSWORD"
      else
        export PACT_BROKER_USERNAME="$ARGUS_RO_PACT_BROKER_USERNAME" PACT_BROKER_PASSWORD="$ARGUS_RO_PACT_BROKER_PASSWORD"
      fi

argus-pact-consumer:
  image: $[[ inputs.golang_pact_image ]]
  stage: $[[ inputs.stage ]]
  needs: [] # standalone: does not depend on (or wait for) the project's own test job
  variables:
    CGO_ENABLED: "1" # pact-go v2 calls libpact_ffi through cgo
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    key:
      files: [go.sum]
      prefix: argus-pact
    paths: [.cache/go-mod, .cache/go-build]
  rules:
    - if: $ARGUS_SKIP
      when: never
    - if: $ARGUS_VERIFY_ONLY == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  interruptible: true
  script:
    - rm -rf "$[[ inputs.pact_dir ]]"
    - |
      if [ -n "$[[ inputs.test_command ]]" ]; then
        $[[ inputs.test_command ]]
      else
        go test -tags pact -run Pact -count=1 -p 1 $[[ inputs.packages ]]
      fi
    - ls "$[[ inputs.pact_dir ]]"/*.json # no pact files = tests did not run; fail loudly
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - $[[ inputs.pact_dir ]]/

argus-pact-publish:
  image: $[[ inputs.argus_image ]]
  stage: $[[ inputs.stage ]]
  extends: .argus-credentials
  needs:
    - job: argus-pact-consumer
      artifacts: true
  rules:
    - if: $ARGUS_SKIP
      when: never
    - if: $ARGUS_VERIFY_ONLY == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  retry: 2
  script:
    - >
      pact-broker publish "$[[ inputs.pact_dir ]]"
      --consumer-app-version "$CI_COMMIT_SHA"
      --branch "$CI_COMMIT_REF_NAME"
