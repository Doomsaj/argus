service: product-detail
group: catalog
role: [provider]            # provider | consumer | both
spec:
  path: target/openapi.json
  generator: springdoc
gate:
  mode: warn                # warn | block
  warnUntil: 2026-12-01     # auto flips to block after this date
  failOn: ERR
waivers:
  - rule: response-property-type-generalized
    path: "POST /v1/products/ 200 /items/variants/price/selling_price"   # illustrative
    reason: "coordinated migration, consumers updated"
    approvedBy: shopping-discovery
    expires: 2026-12-15
pact:
  providerName: product-detail
samples:
  dir: target/argus-samples # optional
